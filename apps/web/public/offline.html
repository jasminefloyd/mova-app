<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18392F">
<title>Mova Beauty · Offline</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#F7F5EF;color:#18392F;font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column}
  header{padding:18px 20px 0}
  .wordmark{font-family:Manrope,system-ui,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.5px}
  main{flex:1;width:100%;max-width:420px;margin:0 auto;padding:96px 28px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
  .icon{width:72px;height:72px;border-radius:36px;background:#EEF3EC;border:1px solid #C9E6D4;display:flex;align-items:center;justify-content:center}
  h1{margin:6px 0 0;font-family:Manrope,system-ui,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.4px}
  p{margin:0;font-size:15px;line-height:1.5;color:#3F4D46}
  .primary,.secondary{align-self:stretch;display:flex;align-items:center;justify-content:center;border-radius:27px;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;font-family:inherit}
  .primary{margin-top:10px;height:54px;background:#18392F;color:#F7F5EF;border:0}
  .secondary{height:48px;border:1px solid #C8CFC5;background:#FFFFFF;color:#18392F;font-weight:600;font-size:15px}
  .note{font-size:13px;color:#4F5F57}
</style>
</head>
<body>
<header><span class="wordmark">mova</span></header>
<main>
  <span class="icon" aria-hidden="true"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#18392F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.5a10 10 0 0 1 4-2.3M19 12.5a10 10 0 0 0-2.6-1.8"/><path d="M2 9a15 15 0 0 1 4.3-2.6M22 9a15 15 0 0 0-10.4-4"/><circle cx="12" cy="20" r=".8" fill="#18392F"/></svg></span>
  <h1 id="title">You’re offline</h1>
  <p id="body">This page wasn’t saved for offline use. Your schedule, appointments and clients are still here from your last visit.</p>
  <a class="primary" id="home" href="/login">Open saved Home</a>
  <button class="secondary" id="retry" type="button">Try again</button>
  <p class="note" id="note">Mova reconnects on its own when you’re back online.</p>
</main>
<script>
  (function () {
    var home = null; var spanish = false;
    try { home = localStorage.getItem('mova_last_home'); } catch (e) {}
    try { spanish = (localStorage.getItem('mova_artist_locale') || navigator.language || '').toLowerCase().indexOf('es') === 0; } catch (e) {}
    if (home && /^\/BID-\d+\/?$/.test(home)) document.getElementById('home').setAttribute('href', home);
    if (spanish) {
      document.documentElement.lang = 'es';
      document.getElementById('title').textContent = 'Estás sin conexión';
      document.getElementById('body').textContent = 'Esta página no se guardó para usar sin conexión. Tu agenda, tus citas y tus clientes siguen aquí desde tu última visita.';
      document.getElementById('home').textContent = 'Abrir Inicio guardado';
      document.getElementById('retry').textContent = 'Intentar de nuevo';
      document.getElementById('note').textContent = 'Mova se vuelve a conectar sola cuando tengas conexión.';
    }
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', function () { location.reload(); });
  })();
</script>
</body>
</html>
