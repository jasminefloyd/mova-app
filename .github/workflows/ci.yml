name: CI

on:
  pull_request:
  push:
    branches: [main, visual-baselines-tmp]

permissions:
  contents: write

jobs:
  p00-contract-gate:
    name: Contract and app checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: TC-REL-MIGR-01 reject edits to existing migrations
        run: node scripts/check-applied-migrations.mjs
        env:
          MIGRATION_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every Edge Function and run Deno tests (task 1.6)
        run: node scripts/fn-check.mjs
      - run: pnpm check-locales
      - run: pnpm build
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Disable optional demo seed in isolated CI database
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path("supabase/config.toml")
          config.write_text(config.read_text() + "\n[db.seed]\nenabled = false\n")
          PY
      - name: Start isolated Supabase database stack
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Reset isolated database without demo seed
        run: supabase db reset --no-seed
      - name: Run pgTAP database suite
        run: supabase test db
      - name: Verify concurrent artist handle claims
        run: node scripts/test-handle-claim-race.mjs
      - name: Stop isolated local database
        if: always()
        run: supabase stop --no-backup
      - name: Start full local stack for seeded database verification
        run: supabase start
      - name: TC-REL-SEED-01 reset database with seed enabled
        run: supabase db reset
      - name: Stop seeded local database
        if: always()
        run: supabase stop --no-backup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: node scripts/run-e2e.mjs -- --config playwright.visual.config.ts --update-snapshots
      - name: Push regenerated baselines to this temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/design-system.spec.ts-snapshots
          git commit -m "TEMP: baselines regenerated in CI" || echo "no changes"
          git push origin HEAD:visual-baselines-tmp
      - run: pnpm phase:verify
      - run: pnpm phase:p01:verify
      - run: pnpm phase:p02:verify
    env:
      CI: true
