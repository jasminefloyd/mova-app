name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  p00-contract-gate:
    name: Contract and app checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check-locales
      - run: pnpm build
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Disable optional demo seed in isolated CI database
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path("supabase/config.toml")
          config.write_text(config.read_text() + "\n[db.seed]\nenabled = false\n")
          PY
      - name: Start isolated Supabase database stack
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Run pgTAP database suite
        run: supabase test db
      - name: Stop isolated local database
        if: always()
        run: supabase stop --no-backup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:visual
      - run: pnpm phase:verify
      - run: pnpm phase:p01:verify
      - run: pnpm phase:p02:verify
    env:
      CI: true
