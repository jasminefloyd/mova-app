<body>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5EF; color: #18392F; font-family: 'DM Sans', sans-serif;">
  <header style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <a href="03-services-deposits.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #18392F;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <span style="font-size: 13px; font-weight: 600; color: #4F5F57;">Step 4 of 6</span>
      <span style="width: 44px;"></span>
    </div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px;">
      <span style="height: 4px; border-radius: 2px; background: #18392F;"></span><span style="height: 4px; border-radius: 2px; background: #18392F;"></span><span style="height: 4px; border-radius: 2px; background: #18392F;"></span><span style="height: 4px; border-radius: 2px; background: #18392F;"></span><span style="height: 4px; border-radius: 2px; background: #D5DBD2;"></span><span style="height: 4px; border-radius: 2px; background: #D5DBD2;"></span>
    </div>
    <h1 style="margin: 6px 0 0; font-family: Manrope, sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.4px;">Where you work</h1>
  </header>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 14px;">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600;">Location name
      <input value="Luxe Salon · Midtown" style="height: 48px; border: 1px solid #C8CFC5; border-radius: 14px; padding: 0 14px; font: 500 16px 'DM Sans', sans-serif; background: #FFFFFF; color: #18392F;">
    </label>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4F5F57;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Time zone: Eastern (America/New_York)</div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px;">
      <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px;">How do clients book here?</legend>
      <label style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; border: 1px solid #C8CFC5; background: #FFFFFF;">
        <input type="radio" name="mode" style="accent-color: #18392F; width: 20px; height: 20px; margin: 2px 0 0;">
        <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 600;">Instant booking</span><span style="font-size: 13px; line-height: 1.35; color: #4F5F57;">Mova holds your calendar here, so clients get confirmed right away.</span></span>
      </label>
      <label style="display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; border: 2px solid #18392F; background: #FFFFFF;">
        <input type="radio" name="mode" checked style="accent-color: #18392F; width: 20px; height: 20px; margin: 2px 0 0;">
        <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 600;">Request to book</span><span style="font-size: 13px; line-height: 1.35; color: #4F5F57;">The salon keeps its own book. You confirm each request after checking it.</span></span>
      </label>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0;">
      <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px;">Who collects payment here?</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <label style="height: 48px; border: 1px solid #C8CFC5; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 15px; font-weight: 500;"><input type="radio" name="collector" style="accent-color: #18392F; width: 18px; height: 18px; margin: 0;">I do</label>
        <label style="height: 48px; border: 2px solid #18392F; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 15px; font-weight: 600;"><input type="radio" name="collector" checked style="accent-color: #18392F; width: 18px; height: 18px; margin: 0;">The salon</label>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0;">
      <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px;">Days you're here</legend>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;">
        <button type="button" aria-pressed="false" aria-label="Sunday" style="height: 44px; border-radius: 12px; border: 1px solid #C8CFC5; background: #FFFFFF; color: #18392F; font: 600 14px 'DM Sans', sans-serif;">S</button>
        <button type="button" aria-pressed="false" aria-label="Monday" style="height: 44px; border-radius: 12px; border: 1px solid #C8CFC5; background: #FFFFFF; color: #18392F; font: 600 14px 'DM Sans', sans-serif;">M</button>
        <button type="button" aria-pressed="false" aria-label="Tuesday" style="height: 44px; border-radius: 12px; border: 1px solid #C8CFC5; background: #FFFFFF; color: #18392F; font: 600 14px 'DM Sans', sans-serif;">T</button>
        <button type="button" aria-pressed="true" aria-label="Wednesday" style="height: 44px; border-radius: 12px; border: 0; background: #18392F; color: #F7F5EF; font: 600 14px 'DM Sans', sans-serif;">W</button>
        <button type="button" aria-pressed="true" aria-label="Thursday" style="height: 44px; border-radius: 12px; border: 0; background: #18392F; color: #F7F5EF; font: 600 14px 'DM Sans', sans-serif;">T</button>
        <button type="button" aria-pressed="false" aria-label="Friday" style="height: 44px; border-radius: 12px; border: 1px solid #C8CFC5; background: #FFFFFF; color: #18392F; font: 600 14px 'DM Sans', sans-serif;">F</button>
        <button type="button" aria-pressed="true" aria-label="Saturday" style="height: 44px; border-radius: 12px; border: 0; background: #18392F; color: #F7F5EF; font: 600 14px 'DM Sans', sans-serif;">S</button>
      </div>
      <p style="margin: 8px 0 0; font-size: 13px; color: #4F5F57;">12:00 – 7:00 PM · <a href="19-locations-hours.html" style="font-weight: 600;">Edit hours</a></p>
    </fieldset>

    <button type="button" style="height: 48px; border-radius: 14px; border: 1.5px dashed #8BA990; background: transparent; color: #18392F; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 15px 'DM Sans', sans-serif;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add another location</button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 26px; background: #F7F5EF; border-top: 1px solid #E2E5DE;">
    <a href="05-payments.html" style="height: 54px; border-radius: 27px; background: #18392F; color: #F7F5EF; display: flex; align-items: center; justify-content: center; font: 700 16px 'DM Sans', sans-serif; text-decoration: none;">Continue</a>
  </div>
</div>
