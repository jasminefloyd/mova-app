<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Mova — Visit notes · reference</title>
<!-- REFERENCE ONLY. Exported from the "Mova App Screens" canvas. Build with the app's components; never copy this markup or its sample data into the app. -->
<style>@font-face{font-family:'Manrope';font-weight:600;font-display:block;src:url('../../fonts/manrope-latin-600-normal.woff2') format('woff2');}@font-face{font-family:'Manrope';font-weight:700;font-display:block;src:url('../../fonts/manrope-latin-700-normal.woff2') format('woff2');}@font-face{font-family:'Manrope';font-weight:800;font-display:block;src:url('../../fonts/manrope-latin-800-normal.woff2') format('woff2');}@font-face{font-family:'DM Sans';font-weight:400;font-display:block;src:url('../../fonts/dm-sans-latin-400-normal.woff2') format('woff2');}@font-face{font-family:'DM Sans';font-weight:500;font-display:block;src:url('../../fonts/dm-sans-latin-500-normal.woff2') format('woff2');}@font-face{font-family:'DM Sans';font-weight:600;font-display:block;src:url('../../fonts/dm-sans-latin-600-normal.woff2') format('woff2');}@font-face{font-family:'DM Sans';font-weight:700;font-display:block;src:url('../../fonts/dm-sans-latin-700-normal.woff2') format('woff2');}
body{margin:0}
*{box-sizing:border-box}
a{color:#18392F}a:hover{color:#264E3E}
html,body{margin:0;background:#F7F5EF}</style>
</head>
<body>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5EF; color: #18392F; font-family: 'DM Sans', sans-serif;">
  <header style="padding: 16px 20px 0; display: flex; align-items: center;">
    <a href="12b-client-visits.html" aria-label="Back to visits" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #18392F;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
  </header>

  <div style="padding: 2px 20px 0; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <h1 style="margin: 0; font-family: Manrope, sans-serif; font-weight: 800; font-size: 25px; letter-spacing: -0.3px;">Visit notes · Andrea L.</h1>
      <span style="font-size: 13px; color: #4F5F57;">Silk press + trim · Thu, Nov 5 · Studio 9</span>
    </div>

    <section aria-label="Before and after photos" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="height: 92px; border-radius: 14px; background: #DCE1D9; padding: 8px; display: flex; align-items: flex-end;"><span style="font-size: 11px; font-weight: 700; color: #3F4D46;">Before</span></div>
      <div style="height: 92px; border-radius: 14px; background: #C9E6D4; padding: 8px; display: flex; align-items: flex-end;"><span style="font-size: 11px; font-weight: 700; color: #264E3E;">After</span></div>
      <button type="button" aria-label="Add photo" style="height: 92px; border-radius: 14px; border: 1.5px dashed #8BA990; background: transparent; color: #18392F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 600 12px 'DM Sans', sans-serif;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Photo</button>
    </section>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600;">What I did
      <textarea rows="3" style="border: 1px solid #C8CFC5; border-radius: 14px; padding: 10px 12px; font: 400 14px/1.45 'DM Sans', sans-serif; background: #FFFFFF; color: #18392F; resize: none;">Wash, deep condition 15 min, blow-dry, press at 380°F in 2 passes. Dusted ends, about ¼ inch.</textarea>
    </label>

    <fieldset style="border: 0; margin: 0; padding: 0;">
      <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px;">Products &amp; settings</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 6px;">
        <span style="font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 14px; background: #FFFFFF; border: 1px solid #C8CFC5;">380°F flat iron</span>
        <span style="font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 14px; background: #FFFFFF; border: 1px solid #C8CFC5;">Heat protectant</span>
        <span style="font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 14px; background: #FFFFFF; border: 1px solid #C8CFC5;">Silk serum</span>
        <button type="button" style="height: 32px; padding: 0 10px; border-radius: 14px; border: 1.5px dashed #8BA990; background: transparent; color: #18392F; font: 600 13px 'DM Sans', sans-serif;">+ Add</button>
      </div>
    </fieldset>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600;">For next time
      <textarea rows="2" style="border: 1px solid #C8CFC5; border-radius: 14px; padding: 10px 12px; font: 400 14px/1.45 'DM Sans', sans-serif; background: #FFFFFF; color: #18392F; resize: none;">Ends still a little dry. Suggest the deep conditioning add-on.</textarea>
    </label>

    <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DCE1D9;">
      <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 600;">Show at her next visit</span><span style="font-size: 12px; color: #4F5F57;">Adds "For next time" to Before you start</span></span>
      <span style="position: relative; width: 52px; height: 32px; border-radius: 16px; background: #18392F; flex: none;"><input type="checkbox" checked aria-label="Show at her next visit" style="position: absolute; inset: 0; opacity: 0; margin: 0;"><span style="position: absolute; top: 4px; left: 24px; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF;"></span></span>
    </label>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 26px; background: #F7F5EF; border-top: 1px solid #E2E5DE; display: flex; flex-direction: column; gap: 6px;">
    <a href="12b-client-visits.html" style="height: 54px; border-radius: 27px; background: #18392F; color: #F7F5EF; display: flex; align-items: center; justify-content: center; font: 700 16px 'DM Sans', sans-serif; text-decoration: none;">Save notes</a>
    <span style="text-align: center; font-size: 12px; color: #4F5F57;">Private to you</span>
  </div>
</div>
</body>
</html>
