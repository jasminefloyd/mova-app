      <span style="font-size: 13px; font-weight: 600; color: #4F5F57;">Step 3 of 6</span>
      <span style="width: 44px;"></span>
    </div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px;">
      <span style="height: 4px; border-radius: 2px; background: #18392F;"></span><span style="height: 4px; border-radius: 2px; background: #18392F;"></span><span style="height: 4px; border-radius: 2px; background: #18392F;"></span><span style="height: 4px; border-radius: 2px; background: #D5DBD2;"></span><span style="height: 4px; border-radius: 2px; background: #D5DBD2;"></span><span style="height: 4px; border-radius: 2px; background: #D5DBD2;"></span>
    </div>
    <h1 style="margin: 4px 0 0; font-family: Manrope, sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.4px;">What you offer</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.4; color: #4F5F57;">Set price, time and deposit for each service.</p>
  </header>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 10px;">
    <section aria-label="Editing Silk press" style="background: #FFFFFF; border: 2px solid #18392F; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
      <label style="display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: #4F5F57;">Service name
        <input value="Silk press" style="height: 46px; border: 1px solid #C8CFC5; border-radius: 12px; padding: 0 14px; font: 600 16px 'DM Sans', sans-serif; color: #18392F; background: #FFFFFF;">
      </label>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: #4F5F57;">Duration
          <input value="90 min" style="height: 46px; width: 100%; border: 1px solid #C8CFC5; border-radius: 12px; padding: 0 12px; font: 500 15px 'DM Sans', sans-serif; color: #18392F; background: #FFFFFF;">
        </label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: #4F5F57;">Buffer
          <input value="15 min" style="height: 46px; width: 100%; border: 1px solid #C8CFC5; border-radius: 12px; padding: 0 12px; font: 500 15px 'DM Sans', sans-serif; color: #18392F; background: #FFFFFF;">
        </label>
        <label style="display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: #4F5F57;">Price
          <input value="$150" style="height: 46px; width: 100%; border: 1px solid #C8CFC5; border-radius: 12px; padding: 0 12px; font: 500 15px 'DM Sans', sans-serif; color: #18392F; background: #FFFFFF;">
        </label>
      </div>
      <div style="border-top: 1px solid #EBEEE8; padding-top: 10px; display: flex; flex-direction: column; gap: 10px;">
        <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px;">
          <span style="font-size: 15px; font-weight: 700;">Require a deposit</span>
          <span style="position: relative; width: 52px; height: 32px; border-radius: 16px; background: #18392F; flex: none;"><input type="checkbox" checked aria-label="Require a deposit" style="position: absolute; inset: 0; opacity: 0; margin: 0;"><span style="position: absolute; top: 4px; left: 24px; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF;"></span></span>
        </label>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
          <div role="group" aria-label="Deposit type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #EBEEE8; border-radius: 12px; padding: 3px;">
            <button type="button" aria-pressed="true" style="height: 40px; border: 0; border-radius: 10px; background: #18392F; color: #F7F5EF; font: 700 14px 'DM Sans', sans-serif;">$</button>
            <button type="button" aria-pressed="false" style="height: 40px; border: 0; border-radius: 10px; background: transparent; color: #18392F; font: 600 14px 'DM Sans', sans-serif;">%</button>
          </div>
          <input aria-label="Deposit amount" value="$40" style="height: 46px; width: 100%; border: 1px solid #C8CFC5; border-radius: 12px; padding: 0 12px; font: 600 15px 'DM Sans', sans-serif; color: #18392F; background: #FFFFFF;">
        </div>
        <p style="margin: 0; font-size: 12px; line-height: 1.4; color: #4F5F57;">Taken at booking where you collect payment. Clients see it on your page and at checkout.</p>
      </div>
    </section>

    <article style="background: #FFFFFF; border: 1px solid #DCE1D9; border-radius: 18px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 16px; font-weight: 600;">Knotless braids</span><span style="font-size: 13px; color: #4F5F57;">4 h 30 min · no deposit</span></div>
      <span style="font-family: Manrope, sans-serif; font-weight: 700; font-size: 16px;">$260</span>
    </article>
    <article style="background: #FFFFFF; border: 1px solid #DCE1D9; border-radius: 18px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 16px; font-weight: 600;">Trim &amp; treatment</span><span style="font-size: 13px; color: #4F5F57;">45 min · no deposit</span></div>
      <span style="font-family: Manrope, sans-serif; font-weight: 700; font-size: 16px;">$65</span>
    </article>
    <button type="button" style="height: 48px; border-radius: 16px; border: 1.5px dashed #8BA990; background: transparent; color: #18392F; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 15px 'DM Sans', sans-serif;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a service</button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 24px; background: #F7F5EF; border-top: 1px solid #E2E5DE;">
