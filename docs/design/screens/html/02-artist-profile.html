a{color:#18392F}a:hover{color:#264E3E}
html,body{margin:0;background:#F7F5EF}</style>

<body>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5EF; color: #18392F; font-family: 'DM Sans', sans-serif;">
  <header style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <a href="01-account.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #18392F;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <span style="font-size: 13px; font-weight: 600; color: #4F5F57;">Step 2 of 6</span>
      <span style="width: 44px;"></span>
    </div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px;">
      <span style="height: 4px; border-radius: 2px; background: #18392F;"></span><span style="height: 4px; border-radius: 2px; background: #18392F;"></span><span style="height: 4px; border-radius: 2px; background: #D5DBD2;"></span><span style="height: 4px; border-radius: 2px; background: #D5DBD2;"></span><span style="height: 4px; border-radius: 2px; background: #D5DBD2;"></span><span style="height: 4px; border-radius: 2px; background: #D5DBD2;"></span>
    </div>
    <h1 style="margin: 6px 0 0; font-family: Manrope, sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.4px;">Your artist profile</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #4F5F57;">This is your public identity. It stays yours when you change salons.</p>
  </header>

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="02b-profile-photo--empty.html" aria-label="Add profile photo" style="width: 76px; height: 76px; border-radius: 38px; border: 1.5px dashed #8BA990; background: #EEF3EC; color: #264E3E; display: flex; align-items: center; justify-content: center; flex: none;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
      <label style="flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600;">Display name
        <input value="Ari Monroe" style="height: 50px; border: 1px solid #C8CFC5; border-radius: 14px; padding: 0 14px; font: 400 16px 'DM Sans', sans-serif; background: #FFFFFF; color: #18392F;">
      </label>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600;">Your link
      <span style="display: flex; align-items: center; height: 50px; border: 1px solid #C8CFC5; border-radius: 14px; background: #FFFFFF; overflow: hidden;">
        <span style="padding: 0 4px 0 14px; font-weight: 400; font-size: 15px; color: #4F5F57;">[DOMAIN]/artists/</span>
        <input value="arimonroe" style="flex: 1; min-width: 0; height: 48px; border: 0; padding: 0 8px 0 0; font: 600 16px 'DM Sans', sans-serif; color: #18392F; background: transparent;">
      </span>
      <span style="display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 13px; color: #264E3E;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Available</span>
    </label>

    <fieldset style="border: 0; margin: 0; padding: 0;">
      <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 10px;">Specialties <span style="font-weight: 400; color: #4F5F57;">· pick up to 5</span></legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <button type="button" aria-pressed="true" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: #18392F; color: #F7F5EF; font: 600 14px 'DM Sans', sans-serif;">Silk press</button>
        <button type="button" aria-pressed="true" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: #18392F; color: #F7F5EF; font: 600 14px 'DM Sans', sans-serif;">Natural hair</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #C8CFC5; background: #FFFFFF; color: #18392F; font: 500 14px 'DM Sans', sans-serif;">Color</button>
        <button type="button" aria-pressed="true" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: #18392F; color: #F7F5EF; font: 600 14px 'DM Sans', sans-serif;">Braids</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #C8CFC5; background: #FFFFFF; color: #18392F; font: 500 14px 'DM Sans', sans-serif;">Locs</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #C8CFC5; background: #FFFFFF; color: #18392F; font: 500 14px 'DM Sans', sans-serif;">Curly cuts</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #C8CFC5; background: #FFFFFF; color: #18392F; font: 500 14px 'DM Sans', sans-serif;">Extensions</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #C8CFC5; background: #FFFFFF; color: #18392F; font: 500 14px 'DM Sans', sans-serif;">Bridal</button>
      </div>
    </fieldset>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600;">Short bio <span style="font-weight: 400; color: #4F5F57; font-size: 13px;">Shown in the language you write it in</span>
      <textarea rows="3" style="border: 1px solid #C8CFC5; border-radius: 14px; padding: 12px 14px; font: 400 15px/1.45 'DM Sans', sans-serif; background: #FFFFFF; color: #18392F; resize: none;">Healthy-hair specialist for silk presses and protective styles. Booking in two locations around the city.</textarea>
    </label>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 26px; background: #F7F5EF; border-top: 1px solid #E2E5DE;">
    <a href="02b-profile-photo--empty.html" style="height: 54px; border-radius: 27px; background: #18392F; color: #F7F5EF; display: flex; align-items: center; justify-content: center; font: 700 16px 'DM Sans', sans-serif; text-decoration: none;">Continue</a>
  </div>
</div>
