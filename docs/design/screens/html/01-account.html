<!doctype html>
<html lang="en">
<head>

<title>Mova — Create account · reference</title>

<style>@font-face{font-family:'Manrope';font-weight:600;font-display:block;src:url('../../fonts/manrope-latin-600-normal.woff2') format('woff2');}@font-face{font-family:'Manrope';font-weight:700;font-display:block;src:url('../../fonts/manrope-latin-700-normal.woff2') format('woff2');}@font-face{font-family:'Manrope';font-weight:800;font-display:block;src:url('../../fonts/manrope-latin-800-normal.woff2') format('woff2');}@font-face{font-family:'DM Sans';font-weight:400;font-display:block;src:url('../../fonts/dm-sans-latin-400-normal.woff2') format('woff2');}@font-face{font-family:'DM Sans';font-weight:500;font-display:block;src:url('../../fonts/dm-sans-latin-500-normal.woff2') format('woff2');}@font-face{font-family:'DM Sans';font-weight:600;font-display:block;src:url('../../fonts/dm-sans-latin-600-normal.woff2') format('woff2');}@font-face{font-family:'DM Sans';font-weight:700;font-display:block;src:url('../../fonts/dm-sans-latin-700-normal.woff2') format('woff2');}
body{margin:0}
*{box-sizing:border-box}
a{color:#18392F}a:hover{color:#264E3E}
html,body{margin:0;background:#F7F5EF}</style>

<body>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5EF; color: #18392F; font-family: 'DM Sans', sans-serif;">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px;">
    <div style="font-family: Manrope, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.5px;">mova<span style="color: #C98F66;">.</span></div>
    <div role="group" aria-label="Language" style="display: flex; background: #FFFFFF; border: 1px solid #DCE1D9; border-radius: 22px; padding: 3px;">
      <button type="button" aria-pressed="true" style="height: 38px; min-width: 48px; border: 0; border-radius: 19px; background: #18392F; color: #F7F5EF; font: 600 13px 'DM Sans', sans-serif;">EN</button>
      <button type="button" aria-pressed="false" style="height: 38px; min-width: 48px; border: 0; border-radius: 19px; background: transparent; color: #18392F; font: 600 13px 'DM Sans', sans-serif;">ES</button>
    </div>
  </header>

  <section style="margin: 0 20px; height: 222px; border-radius: 26px; background: #18392F; position: relative; overflow: hidden; padding: 26px 24px; display: flex; flex-direction: column; justify-content: flex-end;">
    <svg aria-hidden="true" width="210" height="230" viewBox="0 0 210 230" fill="none" style="position: absolute; right: -40px; top: -20px;">
      <path d="M150 220C150 140 120 80 60 30" stroke="#264E3E" stroke-width="2"></path>
      <path d="M128 150C90 150 62 128 52 92C88 92 116 112 128 150Z" fill="#264E3E"></path>
      <path d="M140 110C150 74 176 52 206 48C204 84 180 106 140 110Z" fill="#264E3E"></path>
      <path d="M100 70C78 56 70 34 74 10C98 22 108 44 100 70Z" fill="#8BA990" opacity="0.55"></path>
      <circle cx="176" cy="160" r="8" fill="#E7C3AA"></circle>
    </svg>
    <h1 style="position: relative; margin: 0; font-family: Manrope, sans-serif; font-weight: 800; font-size: 31px; line-height: 1.12; letter-spacing: -0.6px; color: #F7F5EF;">Your business<br>moves with you.</h1>
    <p style="position: relative; margin: 10px 0 0; font-size: 15px; line-height: 1.45; color: #C9E6D4;">Your portfolio, bookings and clients in one place that goes wherever your chair does.</p>
  </section>

  <form style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 14px;">
    <div style="font-size: 13px; font-weight: 600; color: #4F5F57; letter-spacing: 0.4px; text-transform: uppercase;">Step 1 of 6 · Account</div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600;">Email
      <input type="email" placeholder="you@example.com" style="height: 52px; border: 1px solid #C8CFC5; border-radius: 14px; padding: 0 16px; font: 400 16px 'DM Sans', sans-serif; background: #FFFFFF; color: #18392F;">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600;">Password
      <input type="password" placeholder="At least 9 characters" style="height: 52px; border: 1px solid #C8CFC5; border-radius: 14px; padding: 0 16px; font: 400 16px 'DM Sans', sans-serif; background: #FFFFFF; color: #18392F;">
    </label>
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px;">
      <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 6px;">App language</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <label style="height: 48px; border: 2px solid #18392F; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 15px; font-weight: 600;"><input type="radio" name="lang" checked style="accent-color: #18392F; width: 18px; height: 18px; margin: 0;">English (US)</label>
        <label style="height: 48px; border: 1px solid #C8CFC5; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 15px; font-weight: 500;"><input type="radio" name="lang" style="accent-color: #18392F; width: 18px; height: 18px; margin: 0;">Español (EE. UU.)</label>
      </div>
    </fieldset>
    <a href="02-artist-profile.html" style="margin-top: 6px; height: 54px; border-radius: 27px; background: #18392F; color: #F7F5EF; display: flex; align-items: center; justify-content: center; font: 700 16px 'DM Sans', sans-serif; text-decoration: none;">Create account</a>
    <p style="margin: 0; text-align: center; font-size: 13px; color: #4F5F57;">We'll email you a link to verify your address.</p>
    <p style="margin: 0; text-align: center; font-size: 15px; color: #18392F;">Already have an account? <a href="07-home.html" style="font-weight: 700;">Sign in</a></p>
  </form>
</div>
</body>
</html>
